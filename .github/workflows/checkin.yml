name: iamhc Daily Checkin

on:
  schedule:
    # 每天 UTC 23:00 运行（即北京时间次日 07:00）
    - cron: '11 1 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .tools
          # 用带 GITHUB_TOKEN 认证的 gh api 调用，避免未认证 60/小时限流（403）
          asset_url=$(gh api repos/SagerNet/sing-box/releases/latest \
            --jq '.assets[] | select(.name | (endswith(".tar.gz")) and (contains("linux-amd64"))) | .browser_download_url' \
            | head -n1)
          if [ -z "${asset_url:-}" ]; then
            echo "未找到 sing-box linux-amd64 发布资产"
            exit 1
          fi
          curl -fsSL --retry 3 -o .tools/sing-box.tar.gz "$asset_url"
          tar -xzf .tools/sing-box.tar.gz -C .tools
          binary_path=$(find .tools -type f -name sing-box | head -n1)
          if [ -z "${binary_path:-}" ]; then
            echo "解压后未找到 sing-box 可执行文件"
            exit 1
          fi
          chmod 755 "$binary_path"
          echo "Downloaded sing-box to $binary_path"
          echo "$(dirname "$binary_path")" >> "$GITHUB_PATH"
          echo "SINGBOX_BIN=$binary_path" >> "$GITHUB_ENV"

      - name: Prepare account config
        env:
          EMAIL_1: ${{ secrets.EMAIL_1 }}
          PASSWORD_1: ${{ secrets.PASSWORD_1 }}
          PROXY_URL_1: ${{ secrets.PROXY_URL_1 }}
          OTP_SECRET_1: ${{ secrets.OTP_SECRET_1 }}
          ATOKEN_1: ${{ secrets.ATOKEN_1 }}
          EMAIL_2: ${{ secrets.EMAIL_2 }}
          PASSWORD_2: ${{ secrets.PASSWORD_2 }}
          PROXY_URL_2: ${{ secrets.PROXY_URL_2 }}
          OTP_SECRET_2: ${{ secrets.OTP_SECRET_2 }}
          ATOKEN_2: ${{ secrets.ATOKEN_2 }}
          EMAIL_3: ${{ secrets.EMAIL_3 }}
          PASSWORD_3: ${{ secrets.PASSWORD_3 }}
          PROXY_URL_3: ${{ secrets.PROXY_URL_3 }}
          OTP_SECRET_3: ${{ secrets.OTP_SECRET_3 }}
          ATOKEN_3: ${{ secrets.ATOKEN_3 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def env(*names):
              """按顺序取第一个非空环境变量（GitHub Secret 名不区分大小写，这里做兼容）。"""
              for name in names:
                  value = os.getenv(name, "").strip()
                  if value:
                      return value
              return ""

          accounts = []
          for index in range(1, 4):
              email = os.getenv(f"EMAIL_{index}", "").strip()
              password = os.getenv(f"PASSWORD_{index}", "").strip()
              proxy_url = os.getenv(f"PROXY_URL_{index}", "").strip()
              otp_secret = os.getenv(f"OTP_SECRET_{index}", "").strip()
              atoken = env(f"ATOKEN_{index}", f"atoken_{index}")
              if email or password or proxy_url or otp_secret or atoken:
                  accounts.append(
                      {
                          "email": email,
                          "password": password,
                          "proxy_url": proxy_url,
                          "otp_secret": otp_secret,
                          "atoken": atoken,
                      }
                  )

          if not accounts:
              accounts.append(
                  {
                      "email": os.getenv("EMAIL", "").strip(),
                      "password": os.getenv("PASSWORD", "").strip(),
                      "proxy_url": os.getenv("PROXY_URL", "").strip(),
                      "otp_secret": os.getenv("OTP_SECRET", "").strip(),
                      "atoken": env("ATOKEN", "atoken"),
                  }
              )

          first_account = accounts[0] if accounts else {}
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"ACCOUNTS_JSON={json.dumps(accounts, ensure_ascii=False)}\n")
              fh.write("LOCAL_PROXY_URL=http://127.0.0.1:8080\n")
              fh.write(f"SINGBOX_BIN={os.getenv('SINGBOX_BIN', str(Path('.tools/sing-box').resolve()))}\n")
              fh.write(f"EMAIL={first_account.get('email', '')}\n")
              fh.write(f"PASSWORD={first_account.get('password', '')}\n")
              fh.write(f"PROXY_URL={first_account.get('proxy_url', '')}\n")
              fh.write(f"OTP_SECRET={first_account.get('otp_secret', '')}\n")
              fh.write(f"TG_BOT_TOKEN={os.getenv('TG_BOT_TOKEN', '')}\n")
              fh.write(f"TG_CHAT_ID={os.getenv('TG_CHAT_ID', '')}\n")
          # 不打印访问令牌内容，避免泄露到运行日志
          safe_accounts = [
              {**item, "atoken": ("***" if item.get("atoken") else "")} for item in accounts
          ]
          print(json.dumps(safe_accounts, ensure_ascii=False))
          PY

      - name: Run checkin
        env:
          ACCOUNTS_JSON: ${{ env.ACCOUNTS_JSON }}
          LOCAL_PROXY_URL: ${{ env.LOCAL_PROXY_URL }}
          SINGBOX_BIN: ${{ env.SINGBOX_BIN }}
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID }}
          # 读入上次保存的登录会话，脚本会优先复用免登录，失效则自动重新登录
          IAMHC_SESSIONS: ${{ vars.IAMHC_SESSIONS }}
        run: |
          python checkin.py

      - name: Save login sessions
        if: always()
        env:
          # 优先用加密 PAT（有 variables:write 权限）稳定写回；未配置则回退默认 token
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          IAMHC_SESSIONS_UPDATE: ${{ env.IAMHC_SESSIONS_UPDATE }}
        run: |
          # 会话以加密仓库变量形式持久化（非明文文件），供下次运行复原登录、跳过 2FA
          if [ -z "${IAMHC_SESSIONS_UPDATE:-}" ]; then
            echo "本次无会话更新，跳过保存"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "⚠️ 未获取到任何 token，无法保存会话，本次会话仅当次有效"
            exit 0
          fi
          if gh variable set IAMHC_SESSIONS --body "$IAMHC_SESSIONS_UPDATE"; then
            echo "登录会话已保存到仓库变量 IAMHC_SESSIONS，下次运行将复用免登录"
          else
            echo "⚠️ 写入仓库变量失败：请配置 secrets.GH_PAT（细粒度 PAT，授予本仓库 Variables 读写权限），会话仅本次有效"
          fi

      - name: Write time marker
        if: always()
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > time.txt
          chmod 755 time.txt
          ls -l time.txt

      - name: Commit updated time.txt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add time.txt
          git diff --cached --quiet || git commit -m "Update last checkin time"
          git push

      - name: clear old run jobs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "deleted: $run_id"
              gh run delete $run_id || true
            fi
          done
